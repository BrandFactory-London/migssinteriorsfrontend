<style>
  @keyframes migssMenuIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
  @keyframes migssDockIn { from { opacity: 0; transform: translate(-50%, 18px); } to { opacity: 1; transform: translate(-50%, 0); } }
  [data-dock-item] { transition: background-color .3s ease, color .3s ease, transform .2s ease; }
  [data-dock-label] { max-width: 0; opacity: 0; margin-left: 0; white-space: nowrap; overflow: hidden; transition: max-width .45s cubic-bezier(.2,.65,.2,1), opacity .3s ease, margin-left .45s cubic-bezier(.2,.65,.2,1); }
  [data-dock-item][data-cta] [data-dock-label] { max-width: 200px; opacity: 1; margin-left: 10px; }
  @media (hover: hover) {
    [data-dock-item]:hover { background-color: color-mix(in srgb, var(--color-accent) 14%, transparent); color: var(--color-accent-700); }
    [data-dock-item]:hover [data-dock-label] { max-width: 200px; opacity: 1; margin-left: 10px; }
    [data-dock-item][data-cta]:hover { background-color: var(--color-accent-700); color: var(--color-bg); }
  }
  [data-dock-item]:active { transform: scale(.94); }
  [data-dock-item]:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  [data-dock-desk] { display: none; }
  @media (min-width: 1000px) { [data-dock-desk] { display: flex; } [data-dock-mob] { display: none; } }
</style>
</helmet>

          <span style="font-family: var(--font-heading); font-size: 28px; line-height: 1.1;">Kitchen Renovation</span>

          <span style="font-size: 11px; color: var(--color-accent-300); font-feature-settings: 'tnum'; width: 22px;">05</span>
          <span style="font-family: var(--font-heading); font-size: 28px; line-height: 1.1;">Interior Renovation</span>
        </a>
        <a href="Our%20Projects.dc.html" style="display: flex; align-items: baseline; gap: 14px; min-height: 64px; padding-top: 14px; color: inherit; text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--color-neutral-100) 14%, transparent);">

        <span data-dock-label style="font-size: 13.5px; font-weight: 500;">Bathrooms</span>

        <span data-dock-label style="font-size: 13.5px; font-weight: 500;">Kitchens</span>
      </a>
      <a href="Interior%20Renovation.dc.html" data-dock-item data-dock-desk title="Interior Renovation" style="height: 50px; padding: 0 15px; align-items: center; color: inherit; text-decoration: none; border-radius: 999px;">
        <svg width="19" height="19" style="flex: none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M6 20V9l6-4 6 4v11"/><path d="M10 20v-5h4v5"/></svg>
        <span data-dock-label style="font-size: 13.5px; font-weight: 500;">Interiors</span>

      <button type="button" data-dock-item data-dock-mob onClick="{{ openMenu }}" aria-label="Open full menu" style="height: 50px; padding: 0 15px; display: flex; align-items: center; background: transparent; border: 0; color: inherit; border-radius: 999px; font-family: var(--font-body); cursor: pointer;">

        <svg width="18" height="18" style="flex: none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7.2 3.5h-3a1.7 1.7 0 0 0-1.7 1.9c.6 5.3 3 9.6 7 12.9 2.1 1.7 4.2 2.7 6.2 3.1a1.7 1.7 0 0 0 1.9-1.7v-2.9a1.7 1.7 0 0 0-1.4-1.7l-2.5-.4a1.7 1.7 0 0 0-1.5.5l-.9.9a14.5 14.5 0 0 1-4.6-4.6l.9-.9a1.7 1.7 0 0 0 .5-1.5l-.4-2.5a1.7 1.7 0 0 0-1.7-1.4z"/></svg>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:140},&quot;phone&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;0208 243 2903&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;email&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;info@migssinteriors.com&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { menuOpen: false };
  renderVals() {
    const phone = this.props.phone ?? '0208 243 2903';
    const email = this.props.email ?? 'info@migssinteriors.com';
    return {
      phone, email,
      telHref: 'tel:' + phone.replace(/\s+/g, ''),
      menuOpen: this.state.menuOpen,
      showDock: !this.state.menuOpen,
      openMenu: () => this.setState({ menuOpen: true }),
      closeMenu: () => this.setState({ menuOpen: false })
    };
  }
}

</script>
