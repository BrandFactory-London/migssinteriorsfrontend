<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/classical-5bab0769-2729-4098-87c3-fef0da1900aa/styles.css">
<script src="_ds/classical-5bab0769-2729-4098-87c3-fef0da1900aa/_ds_bundle.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
<style>@keyframes migssFade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }</style>
</helmet>

<div style="background: var(--color-bg); border: 1px solid var(--color-divider); border-top: 2px solid var(--color-accent); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); padding: clamp(16px, 4vw, 28px); font-family: var(--font-body); color: var(--color-text);">
  <div style="display: flex; align-items: center; gap: 12px; margin-bottom: var(--space-4);">
    <span style="font-size: 11.5px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-accent-700); font-feature-settings: 'tnum';">{{ stepLabel }}</span>
    <span style="flex: 1; height: 3px; background: var(--color-neutral-300); border-radius: 2px; overflow: hidden; display: block;">
      <span style="display: block; height: 100%; width: {{ progressWidth }}; background: var(--color-accent); transition: width 0.35s ease;"></span>
    </span>
  </div>

  <form onSubmit="{{ onSubmit }}" style="display: flex; flex-direction: column; gap: var(--space-3);">
    <sc-if value="{{ isStep1 }}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: var(--space-3); animation: migssFade 0.3s ease-out both;">
        <h3 style="margin: 0; font-family: var(--font-heading); font-weight: 400; font-size: 21px;">Contact details</h3>
        <div style="display: grid; gap: var(--space-3); grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr));">
          <div class="field">
            <label for="mq-first" style="font-size: 12.5px;">First name</label>
            <input id="mq-first" class="input" type="text" autoComplete="given-name" placeholder="Sarah" style="min-height: 56px; font-size: 16px; padding: 0 14px;">
          </div>
          <div class="field">
            <label for="mq-last" style="font-size: 12.5px;">Last name</label>
            <input id="mq-last" class="input" type="text" autoComplete="family-name" placeholder="Whitfield" style="min-height: 56px; font-size: 16px; padding: 0 14px;">
          </div>
        </div>
        <div class="field">
          <label for="mq-phone" style="font-size: 12.5px;">Phone</label>
          <input id="mq-phone" class="input" type="tel" autoComplete="tel" inputMode="tel" placeholder="07700 000000" style="min-height: 56px; font-size: 16px; padding: 0 14px;">
        </div>
        <div class="field">
          <label for="mq-email" style="font-size: 12.5px;">Email</label>
          <input id="mq-email" class="input" type="email" autoComplete="email" inputMode="email" placeholder="you@example.com" style="min-height: 56px; font-size: 16px; padding: 0 14px;">
        </div>
        <button type="button" onClick="{{ next }}" class="btn btn-primary" style="min-height: 58px; font-family: var(--font-body); font-weight: 500; font-size: 15px; margin-top: var(--space-1);">Continue to your project →</button>
      </div>
    </sc-if>

    <sc-if value="{{ isStep2 }}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: var(--space-3); animation: migssFade 0.3s ease-out both;">
        <h3 style="margin: 0; font-family: var(--font-heading); font-weight: 400; font-size: 21px;">Your project</h3>
        <fieldset style="border: 0; margin: 0; padding: 0;">
          <legend style="font-size: 12.5px; margin-bottom: 8px; color: color-mix(in srgb, var(--color-text) 70%, transparent);">What are we renovating?</legend>
          <div style="display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr));">
            <label class="radio" style="min-height: 56px; padding: 0 14px; border: 1px solid var(--color-divider); border-radius: var(--radius-md); font-size: 15px;"><input type="radio" name="mq-type" defaultChecked="{{ isBathroom }}"><span class="dot"></span>Bathroom</label>
            <label class="radio" style="min-height: 56px; padding: 0 14px; border: 1px solid var(--color-divider); border-radius: var(--radius-md); font-size: 15px;"><input type="radio" name="mq-type" defaultChecked="{{ isKitchen }}"><span class="dot"></span>Kitchen</label>
            <label class="radio" style="min-height: 56px; padding: 0 14px; border: 1px solid var(--color-divider); border-radius: var(--radius-md); font-size: 15px;"><input type="radio" name="mq-type" defaultChecked="{{ isInterior }}"><span class="dot"></span>Whole home</label>
            <label class="radio" style="min-height: 56px; padding: 0 14px; border: 1px solid var(--color-divider); border-radius: var(--radius-md); font-size: 15px;"><input type="radio" name="mq-type"><span class="dot"></span>Something else</label>
          </div>
        </fieldset>
        <div class="field">
          <label for="mq-town" style="font-size: 12.5px;">Town or postcode</label>
          <input id="mq-town" class="input" type="text" autoComplete="postal-code" placeholder="Chigwell, IG7" style="min-height: 56px; font-size: 16px; padding: 0 14px;">
        </div>
        <div class="field">
          <label for="mq-budget" style="font-size: 12.5px;">Indicative budget</label>
          <select id="mq-budget" class="input" style="min-height: 56px; font-size: 16px; padding: 0 10px;">
            <option>Not sure yet</option>
            <option>£15k – £30k</option>
            <option>£30k – £60k</option>
            <option>£60k – £100k</option>
            <option>£100k +</option>
          </select>
        </div>
        <div class="field">
          <label for="mq-notes" style="font-size: 12.5px;">Anything we should know? (optional)</label>
          <textarea id="mq-notes" class="input" placeholder="Timings, style references, rooms involved…" style="min-height: 104px; font-size: 16px; padding: 12px 14px;"></textarea>
        </div>
        <button type="submit" class="btn btn-primary" style="min-height: 58px; font-family: var(--font-body); font-weight: 500; font-size: 15px; margin-top: var(--space-1);">Send my enquiry</button>
        <button type="button" onClick="{{ back }}" class="btn btn-ghost" style="min-height: 48px; font-family: var(--font-body); font-size: 14px;">← Back to contact details</button>
      </div>
    </sc-if>

    <sc-if value="{{ isDone }}" hint-placeholder-val="{{ false }}">
      <div style="border: 1px solid var(--color-accent); border-radius: var(--radius-md); padding: var(--space-6) var(--space-4); text-align: center; animation: migssFade 0.3s ease-out both;">
        <h3 style="margin: 0 0 var(--space-2); font-family: var(--font-heading); font-weight: 400; font-size: 26px;">Thank you — enquiry received.</h3>
        <p style="margin: 0 0 var(--space-3); font-size: 15px; line-height: 1.7; color: color-mix(in srgb, var(--color-text) 75%, transparent);">We will call you back the same working day. If it is urgent, ring {{ phone }}.</p>
        <button type="button" onClick="{{ reset }}" class="btn btn-secondary" style="min-height: 50px; font-family: var(--font-body);">Send another enquiry</button>
      </div>
    </sc-if>
  </form>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:460,&quot;height&quot;:640},&quot;phone&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;0208 243 2903&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;focus&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;bathroom&quot;,&quot;kitchen&quot;,&quot;interior&quot;],&quot;default&quot;:&quot;none&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { step: 1 };
  renderVals() {
    const phone = this.props.phone ?? '0208 243 2903';
    const focus = this.props.focus ?? 'none';
    const step = this.state.step;
    return {
      phone,
      isBathroom: focus === 'bathroom',
      isKitchen: focus === 'kitchen',
      isInterior: focus === 'interior',
      isStep1: step === 1,
      isStep2: step === 2,
      isDone: step === 3,
      stepLabel: step === 3 ? 'Complete' : 'Step ' + step + ' of 2',
      progressWidth: step === 1 ? '50%' : '100%',
      next: () => this.setState({ step: 2 }),
      back: () => this.setState({ step: 1 }),
      reset: () => this.setState({ step: 1 }),
      onSubmit: (e) => { e.preventDefault(); this.setState({ step: 3 }); }
    };
  }
}

</script>
</body>
</html>
